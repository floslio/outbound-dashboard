      // Dynamic week: Monday to Sunday of current week
      const day = now.getDay(); // 0=Sun
      const diffToMon = day === 0 ? -6 : 1 - day;
      const mon = new Date(y, now.getMonth(), now.getDate() + diffToMon);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      const weekStart = toISO(mon);
      const weekEnd = toISO(sun);

      // Dynamic month
      const monthStart = `${y}-${pad(now.getMonth()+1)}-01`;
      const lastDay = new Date(y, now.getMonth()+1, 0).getDate();
      const monthEnd = `${y}-${pad(now.getMonth()+1)}-${pad(lastDay)}`;

      switch(periodKey) {
        case 'today': return [today, today];
        case 'week': return [weekStart, weekEnd];
        case 'month': return [monthStart, monthEnd];
        case 'q1': return [`${y}-01-01`,`${y}-03-31`];
        case 'q2': return [`${y}-04-01`,`${y}-06-30`];
        case 'q3': return [`${y}-07-01`,`${y}-09-30`];

      // Exact today
      if (from === todayStr && to === todayStr) return 'today';

      // Check if range matches current week (Mon-Sun, dynamic)

      const diffM = dow === 0 ? -6 : 1 - dow;
      const cwMon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffM);
      const cwSun = new Date(cwMon.getFullYear(), cwMon.getMonth(), cwMon.getDate() + 6);

      // Check if range covers current month

      if (f <= m1 && t >= mLast) return 'month';

      // Check quarters (dynamic)
      const qIdx = Math.floor(mo / 3);
      const quarters = [[0,2],[3,5],[6,8],[9,11]];
      const qKeys = ['q1','q2','q3','q4'];
      for (let qi = 0; qi < 4; qi++) {
        const qs = new Date(yr, quarters[qi][0], 1);
        const qe = new Date(yr, quarters[qi][1] + 1, 0);
        if (f <= qs && t >= qe) return qKeys[qi];
      }

      // Fallback: find the smallest period that overlaps most
      const daysDiff = Math.round((t - f) / 86400000);
      if (daysDiff === 0) return 'today';
      if (daysDiff <= 7) return 'week';
      if (daysDiff <= 31) return 'month';
      return 'q1'; // default for large ranges
    }

    // Preset ranges
    function getPresetRange(key) {
      const now = new Date();
      const pad = d => String(d).padStart(2,'0');
      const toISO = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
      const today = toISO(now);
      const y = now.getFullYear();
      const m = now.getMonth(); // 0-based

      // Yesterday
      const yd = new Date(y, m, now.getDate() - 1);

      // This week: Monday to Sunday
      const dow = now.getDay(); // 0=Sun
      const diffMon = dow === 0 ? -6 : 1 - dow;
      const mon = new Date(y, m, now.getDate() + diffMon);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);

      // Last week
      const lMon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() - 7);
      const lSun = new Date(lMon.getFullYear(), lMon.getMonth(), lMon.getDate() + 6);

      // This month
      const mEnd = new Date(y, m + 1, 0); // last day of current month

      // Last month
      const lmStart = new Date(y, m - 1, 1);
      const lmEnd = new Date(y, m, 0);

      // This quarter
      const qStart = new Date(y, Math.floor(m / 3) * 3, 1);
      const qEnd = new Date(y, Math.floor(m / 3) * 3 + 3, 0);

      switch(key) {
        case 'today': return { from: today, to: today };
        case 'yesterday': return { from: toISO(yd), to: toISO(yd) };
        case 'thisWeek': return { from: toISO(mon), to: toISO(sun) };
        case 'lastWeek': return { from: toISO(lMon), to: toISO(lSun) };
        case 'thisMonth': return { from: `${y}-${pad(m+1)}-01`, to: toISO(mEnd) };
        case 'lastMonth': return { from: toISO(lmStart), to: toISO(lmEnd) };
        case 'thisQuarter': return { from: toISO(qStart), to: toISO(qEnd) };
        case 'last30': {
          const start = new Date(y, m, now.getDate() - 30);
          return { from: toISO(start), to: today };
        }
        default: return null;
      }
    }

    // ─── SVG CHART HELPERS ────────────────────────────

    function buildAreaChart(data, key1, key2, color1, color2, label1, label2) {
      const W = 520, H = 200, pad = { t:20, r:20, b:30, l:40 };
      const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
      const maxVal = Math.max(...data.map(d => Math.max(d[key1], d[key2]))) * 1.1;
      const n = data.length;

      function x(i) { return pad.l + (i / (n-1)) * cw; }
      function y(v) { return pad.t + ch - (v / maxVal) * ch; }

      let path1 = `M${x(0)},${y(data[0][key1])}`;
      let path2 = `M${x(0)},${y(data[0][key2])}`;
      for (let i = 1; i < n; i++) {
        path1 += ` L${x(i)},${y(data[i][key1])}`;
        path2 += ` L${x(i)},${y(data[i][key2])}`;
      }
      const area1 = path1 + ` L${x(n-1)},${pad.t+ch} L${x(0)},${pad.t+ch} Z`;
      const area2 = path2 + ` L${x(n-1)},${pad.t+ch} L${x(0)},${pad.t+ch} Z`;

      let gridLines = '';
      for (let i = 0; i <= 4; i++) {
        const yy = pad.t + (i/4) * ch;
        const val = Math.round(maxVal * (1 - i/4));
        gridLines += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="rgba(100,116,139,0.12)" stroke-dasharray="3"/>`;
        gridLines += `<text x="${pad.l-6}" y="${yy+4}" fill="#64748b" font-size="10" text-anchor="end">${val}</text>`;
      }

      let xLabels = '';
      data.forEach((d, i) => {
        xLabels += `<text x="${x(i)}" y="${H-6}" fill="#64748b" font-size="10" text-anchor="middle">${d.week}</text>`;
      });

      let dots = '';
      data.forEach((d, i) => {
        dots += `<circle cx="${x(i)}" cy="${y(d[key1])}" r="3" fill="${color1}" stroke="#0a0b14" stroke-width="1.5"/>`;
        dots += `<circle cx="${x(i)}" cy="${y(d[key2])}" r="3" fill="${color2}" stroke="#0a0b14" stroke-width="1.5"/>`;
      });

      return `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:260px">
        ${gridLines}
        <path d="${area1}" fill="${color1}" opacity="0.15"/>
        <path d="${area2}" fill="${color2}" opacity="0.1"/>
        <path d="${path1}" fill="none" stroke="${color1}" stroke-width="2"/>
        <path d="${path2}" fill="none" stroke="${color2}" stroke-width="2"/>
        ${dots}
        ${xLabels}
        <circle cx="${W-110}" cy="8" r="4" fill="${color1}"/><text x="${W-102}" y="12" fill="#94a3b8" font-size="10">${label1}</text>
        <circle cx="${W-50}" cy="8" r="4" fill="${color2}"/><text x="${W-42}" y="12" fill="#94a3b8" font-size="10">${label2}</text>
      </svg>`;
    }

    function buildBarChart(data, key1, key2, color1, color2, label1, label2) {
      const W = 520, H = 200, pad = { t:20, r:50, b:30, l:40 };
      const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
      const maxVal1 = Math.max(...data.map(d => d[key1])) * 1.2;
      const maxVal2 = Math.max(...data.map(d => d[key2])) * 1.2;
      const n = data.length;
      const bw = (cw / n) * 0.35;

      function x(i) { return pad.l + (i + 0.5) * (cw / n); }
      function y1(v) { return pad.t + ch - (v / maxVal1) * ch; }
      function y2(v) { return pad.t + ch - (v / maxVal2) * ch; }

      let gridLines = '';
      for (let i = 0; i <= 4; i++) {
        const yy = pad.t + (i/4) * ch;
        const val = Math.round(maxVal1 * (1 - i/4));
        gridLines += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="rgba(100,116,139,0.12)" stroke-dasharray="3"/>`;
        gridLines += `<text x="${pad.l-6}" y="${yy+4}" fill="#64748b" font-size="10" text-anchor="end">${val}</text>`;
      }

      let bars = '';
      data.forEach((d, i) => {
        const cx = x(i);
        const h1 = (d[key1] / maxVal1) * ch;
        const h2 = (d[key2] / maxVal2) * ch;
        bars += `<rect x="${cx - bw - 1}" y="${pad.t + ch - h1}" width="${bw}" height="${h1}" rx="3" fill="${color1}"/>`;
        bars += `<rect x="${cx + 1}" y="${pad.t + ch - h2}" width="${bw}" height="${h2}" rx="3" fill="${color2}" opacity="0.6"/>`;
        bars += `<text x="${cx}" y="${H-6}" fill="#64748b" font-size="10" text-anchor="middle">${d.week}</text>`;
      });

      return `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:260px">
        ${gridLines}
        ${bars}
        <rect x="${W-120}" y="4" width="10" height="10" rx="2" fill="${color1}"/><text x="${W-106}" y="13" fill="#94a3b8" font-size="10">${label1}</text>
        <rect x="${W-55}" y="4" width="10" height="10" rx="2" fill="${color2}" opacity="0.6"/><text x="${W-41}" y="13" fill="#94a3b8" font-size="10">${label2}</text>
      </svg>`;
    }

    function buildWinRateSection() {
      // Extract counts from FUNNEL data
      const won = FUNNEL.find(f => f.stage === 'Closed Won')?.count || 0;
      const lost = FUNNEL.find(f => f.stage === 'Lost')?.count || 0;
      const noFit = FUNNEL.find(f => f.stage === 'No Fit')?.count || 0;
      const badTiming = FUNNEL.find(f => f.stage === 'Bad Timing')?.count || 0;
      const totalClosed = won + lost + noFit + badTiming;
      const totalDecided = won + lost; // Excluding No Fit / Bad Timing (not real losses)

      const winRate = totalClosed > 0 ? (won / totalClosed * 100) : 0;
      const closeRate = totalDecided > 0 ? (won / totalDecided * 100) : 0;
      const lostRate = totalClosed > 0 ? (lost / totalClosed * 100) : 0;
      const noFitRate = totalClosed > 0 ? (noFit / totalClosed * 100) : 0;
      const badTimingRate = totalClosed > 0 ? (badTiming / totalClosed * 100) : 0;

      function intensity(val, max) {
        if (max === 0) return 0;
        return val / max;
      }

      function cellColor(val, max, baseColor) {
        const i = intensity(val, max);
        if (i === 0) return 'rgba(26,27,53,0.5)';
        // Mix base color with opacity
        const opacity = 0.15 + i * 0.7;
        return baseColor.replace(')', `,${opacity})`).replace('rgb', 'rgba').replace('#', '');
      }

      function hexToRgba(hex, opacity) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `rgba(${r},${g},${b},${opacity})`;
      }

        case 'all': weeks = TRENDS; break;
        case 'q1': weeks = TRENDS.filter(w => { const n = parseInt(w.week.replace('CW','')); return n >= 1 && n <= 13; }); break;
        case 'q2': weeks = TRENDS.filter(w => { const n = parseInt(w.week.replace('CW','')); return n >= 14 && n <= 26; }); break;
        case 'last4': weeks = TRENDS.slice(-4); break;
        case 'last8': weeks = TRENDS.slice(-8); break;
        default: weeks = TRENDS.slice(-4);
      }
      if (weeks.length === 0) return '<div class="text-sm text-slate-500 text-center py-4">No data for this period</div>';

      const metrics = [
        { key:'emails', label:'Outreach', color:'#818cf8', format: v => v },
        { key:'calls', label:'Calls', color:'#a78bfa', format: v => v },
        { key:'linkedin', label:'LinkedIn', color:'#c084fc', format: v => v || 0 },
        { key:'demos', label:'Demos', color:'#34d399', format: v => v },
        { key:'pipeline', label:'Pipeline', color:'#f59e0b', format: v => '\u20AC' + v + 'k' },
      ];

      // Filter pills
      const filterPills = ['last4','last8','q1','all'].map(mode => {
        const labels = { last4:'Last 4', last8:'Last 8', q1:'Q1', all:'All' };
        const active = wowViewMode === mode;
        return `<button onclick="setWoWView('${mode}')" class="px-2.5 py-1 rounded-lg text-[10px] font-medium transition-all ${active ? 'bg-brand-500/20 text-brand-300 border border-brand-500/40' : 'text-slate-500 border border-slate-700/30 hover:text-slate-300'}">${labels[mode]}</button>`;
      }).join('');

      // Table header
      const header = weeks.map((w, i) => {
        const kwNum = parseInt(w.week.replace('CW',''));
        const isCurrent = kwNum === currentKW;
        return `<th class="py-2 px-2 text-center text-[10px] font-semibold ${isCurrent ? 'text-brand-300' : 'text-slate-500'} uppercase tracking-wider whitespace-nowrap">${w.week}${isCurrent ? ' \u25CF' : ''}</th>`;
      }).join('');

      // Table rows with delta badges
      const rows = metrics.map(m => {
        const cells = weeks.map((w, i) => {
          const val = w[m.key];
          const prev = i > 0 ? weeks[i-1][m.key] : null;
          const kwNum = parseInt(w.week.replace('CW',''));
          const isCurrent = kwNum === currentKW;

          let deltaHTML = '';
          if (prev !== null && prev > 0) {
            const changePct = Math.round(((val - prev) / prev) * 100);
            if (changePct > 0) deltaHTML = `<div class="text-[8px] text-emerald-400 font-semibold">\u25B2${changePct}%</div>`;
            else if (changePct < 0) deltaHTML = `<div class="text-[8px] text-red-400 font-semibold">\u25BC${Math.abs(changePct)}%</div>`;
            else deltaHTML = `<div class="text-[8px] text-slate-600">\u21920%</div>`;
          } else if (prev === 0 && val > 0) {
            deltaHTML = `<div class="text-[8px] text-emerald-400">\u2191new</div>`;
          }

          return `<td class="py-2 px-2 text-center ${isCurrent ? 'bg-brand-500/5' : ''}">
            <div class="text-xs font-bold ${isCurrent ? 'text-white' : 'text-slate-300'}">${m.format(val)}</div>
            ${deltaHTML}
          </td>`;
        }).join('');

        // Trend sparkline
        const maxVal = Math.max(...weeks.map(w => w[m.key]), 1);
        const spark = `<td class="py-2 px-2">
          <div class="flex items-end gap-0.5 h-5">
            ${weeks.map((w, i) => {
              const h = Math.max((w[m.key] / maxVal) * 18, 2);
              const kwNum = parseInt(w.week.replace('CW',''));
              const isCurrent = kwNum === currentKW;
              return `<div class="flex-1 rounded-sm" style="height:${h}px;background:${isCurrent ? m.color : m.color + '40'}"></div>`;
            }).join('')}
          </div>
        </td>`;

        return `<tr class="border-b border-slate-800/30">
          <td class="py-2 px-2">
            <div class="flex items-center gap-1.5">
              <div class="w-2 h-2 rounded-full" style="background:${m.color}"></div>
              <span class="text-[11px] text-slate-400 font-medium">${m.label}</span>
            </div>
          </td>
          ${cells}
          ${spark}
        </tr>`;
      }).join('');

      // Totals per week
      const totalRow = `<tr class="border-t border-slate-700/50">
        <td class="py-2 px-2 text-[10px] text-slate-500 font-semibold">Total</td>
        ${weeks.map((w, i) => {
          const total = w.emails + w.calls + (w.linkedin||0);
          const prev = i > 0 ? weeks[i-1].emails + weeks[i-1].calls + (weeks[i-1].linkedin||0) : null;
          const kwNum = parseInt(w.week.replace('CW',''));
          const isCurrent = kwNum === currentKW;
          let dHTML = '';
          if (prev !== null && prev > 0) {
            const ch = Math.round(((total - prev) / prev) * 100);
            dHTML = ch > 0 ? `<span class="text-emerald-400">+${ch}%</span>` : ch < 0 ? `<span class="text-red-400">${ch}%</span>` : '';
          }
          return `<td class="py-2 px-2 text-center ${isCurrent ? 'bg-brand-500/5' : ''}">
            <span class="text-[11px] font-bold ${isCurrent ? 'text-white' : 'text-slate-400'}">${total}</span>
            <span class="text-[8px] ml-1">${dHTML}</span>
          </td>`;
        }).join('')}
        <td></td>
      </tr>`;

      return `<div class="flex items-center gap-1.5 mb-3">${filterPills}</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-slate-700/40">
              <th class="py-2 px-2 text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider w-20">Metric</th>
              ${header}
              <th class="py-2 px-2 text-[10px] font-semibold text-slate-500 uppercase tracking-wider w-16">Trend</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            ${totalRow}
          </tbody>
        </table>
      </div>`;
    }

    function buildDealStageHeatmap() {
      const hm = DEAL_STAGE_HEATMAP;
      const stages = hm.stages;
      const people = hm.people;

      // Find global max for color scaling
      const allCounts = people.flatMap(p => p.counts);
      const maxVal = Math.max(...allCounts, 1);

      // Stage totals
      const stageTotals = stages.map((_, si) => people.reduce((s, p) => s + p.counts[si], 0));
      const grandTotal = stageTotals.reduce((s, v) => s + v, 0);

      function heatColor(val) {
        if (val === 0) return 'rgba(26,27,53,0.5)';
        const intensity = val / maxVal;
        if (intensity < 0.25) return `rgba(99,102,241,${0.12 + intensity * 0.3})`;
        if (intensity < 0.5) return `rgba(99,102,241,${0.2 + intensity * 0.4})`;
        if (intensity < 0.75) return `rgba(124,58,237,${0.25 + intensity * 0.35})`;
        return `rgba(139,92,246,${0.4 + intensity * 0.35})`;
      }

      // Header row
      const headerCells = stages.map((s, i) =>
        `<th class="py-2 px-1 text-center" style="min-width:44px">
          <div class="text-[8px] text-slate-500 font-medium leading-tight truncate" title="${s}">${s.length > 8 ? s.slice(0,7)+'.' : s}</div>
        </th>`
      ).join('');

      // Person rows
      const personRows = people.map(p => {
        const rowTotal = p.counts.reduce((s, v) => s + v, 0);
        const cells = p.counts.map((val, si) => {
          const bg = heatColor(val);
          const textClass = val === 0 ? 'text-slate-700' : val >= maxVal * 0.5 ? 'text-white font-bold' : 'text-slate-300 font-medium';
          return `<td class="py-0 px-0 text-center">
            <div class="mx-0.5 my-0.5 rounded h-9 flex items-center justify-center text-[11px] ${textClass}" style="background:${bg}" title="${p.short}: ${val} Deals in ${stages[si]}">
              ${val > 0 ? val : '<span class="text-[9px]">\u00B7</span>'}
            </div>
          </td>`;
        }).join('');
        return `<tr>
          <td class="py-0 px-2 text-[11px] text-slate-400 font-medium whitespace-nowrap">${p.short}</td>
          ${cells}
          <td class="py-0 px-2 text-center text-[11px] font-semibold text-white">${rowTotal}</td>
        </tr>`;
      }).join('');

      // Totals row
      const totalCells = stageTotals.map(t =>
        `<td class="py-1.5 px-0 text-center">
          <span class="text-[10px] font-bold text-slate-300">${t}</span>
        </td>`
      ).join('');

      // Stage distribution mini bar at bottom
      const maxStageTotal = Math.max(...stageTotals, 1);
      const distBars = stageTotals.map((t, i) => {
        const w = Math.max((t / maxStageTotal) * 100, 3);
        return `<td class="py-0 px-0">
          <div class="mx-0.5 h-1.5 rounded-full" style="width:${w}%;background:${hm.stageColors[i]};opacity:0.6" title="${stages[i]}: ${t}"></div>
        </td>`;
      }).join('');

      // Color legend
      const legendSteps = [0, 5, 10, 15, 20, 25, 30];
      const legend = legendSteps.map(v =>
        `<div class="flex items-center gap-1">
          <div class="w-3 h-3 rounded-sm" style="background:${heatColor(v)}"></div>
          <span class="text-[8px] text-slate-600">${v}</span>
        </div>`
      ).join('');

      return `<div class="overflow-x-auto">
        <table class="w-full" style="border-spacing:0">
          <thead>
            <tr class="border-b border-slate-700/30">
              <th class="py-2 px-2 text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider w-20">Person</th>
              ${headerCells}
              <th class="py-2 px-2 text-center text-[10px] font-semibold text-slate-500 uppercase tracking-wider">\u03A3</th>
            </tr>
          </thead>
          <tbody>
            ${personRows}
            <tr class="border-t border-slate-700/30">
              <td class="py-1.5 px-2 text-[10px] text-slate-500 font-semibold">\u03A3</td>
              ${totalCells}
              <td class="py-1.5 px-2 text-center text-[11px] font-bold text-brand-300">${grandTotal}</td>
            </tr>
            <tr>
              <td></td>
              ${distBars}
              <td></td>
            </tr>
          </tbody>
        </table>
        <div class="flex items-center gap-3 mt-3 pt-2 border-t border-slate-700/20">
          <span class="text-[9px] text-slate-600">Intensity:</span>
          <div class="flex items-center gap-2">${legend}</div>
          <span class="text-[9px] text-slate-600 ml-auto">${grandTotal} active Deals \u00B7 ${stages.length} Stages</span>
        </div>
      </div>`;
    }

    function buildConversionFunnel() {
      // Dynamic: derive counts from current FUNNEL
      const fc = (stage) => (FUNNEL.find(f => f.stage === stage) || {}).count || 0;
      const prospectCount = fc('Outbound Prospect') + fc('Outbound Lead');
      const leadCount = prospectCount + fc('Inbound Lead');
      const salCount = fc('SAL (Book 1st Demo)');
      const sqlCount = fc('SQL (Demo Done)');
      const oppCount = fc('Opportunity') + fc('Vendor of Choice') + fc('Order Review') + fc('Verbal Commit.') + fc('Contract Neg.') + fc('Signing') + fc('Pilot ARR');
      const wonCount = fc('Closed Won');

      const stages = [
        { stage:'Prospect', count:prospectCount, desc:'Outbound contacts identified', color:'#818cf8' },
        { stage:'Lead', count:leadCount, desc:'Inbound + Outbound qualified', color:'#7c3aed' },
        { stage:'SAL', count:salCount, desc:'Sales Accepted Lead — 1st demo booked', color:'#6d28d9' },
        { stage:'SQL', count:sqlCount, desc:'Sales Qualified Lead — Demo done & Fit', color:'#5b21b6' },
        { stage:'Opportunity', count:oppCount, desc:'Workshop interest / active evaluation', color:'#8b5cf6' },
        { stage:'Won', count:wonCount, desc:'Deal closed', color:'#34d399' },
      ];
      const maxC = Math.max(...stages.map(s => s.count), 1);
      return `<div class="space-y-0">
        ${stages.map((s, i) => {
          const widthPct = Math.max((s.count / maxC) * 100, 25);
          const next = stages[i + 1];
          const rate = (next && s.count > 0) ? Math.round((next.count / s.count) * 100) : null;
          const dropOff = next ? s.count - next.count : null;
          const isWon = s.stage === 'Won';
          return `<div>
            <div class="flex items-center gap-3">
              <div class="relative" style="width:${widthPct}%">
                <div class="h-9 rounded-lg flex items-center px-3 gap-2" style="background:${s.color}">
                  <span class="text-sm font-bold text-white">${s.count}</span>
                  <span class="text-[11px] font-semibold text-white/90">${s.stage}</span>
                </div>
              </div>
              <span class="text-[10px] text-slate-500 leading-tight flex-1">${s.desc}</span>
            </div>
            ${rate !== null ? `<div class="flex items-center gap-2 ml-4 my-0.5">
              <div class="flex items-center gap-1">
                <svg width="12" height="14" viewBox="0 0 12 14"><path d="M6 0v10M2 7l4 4 4-4" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="text-[11px] font-bold ${rate >= 80 ? 'text-emerald-400' : rate >= 50 ? 'text-brand-300' : 'text-amber-400'}">${rate}%</span>
                <span class="text-[10px] text-slate-600">Conversion</span>
              </div>
              ${dropOff > 0 ? `<span class="text-[10px] text-slate-600">· -${Math.abs(dropOff)} Drop-off</span>` : dropOff < 0 ? `<span class="text-[10px] text-slate-600">· +${Math.abs(dropOff)} Lateral Entry</span>` : ''}
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="mt-4 grid grid-cols-4 gap-2">
        <div class="text-center p-2 rounded-lg" style="background:#111225">
          <div class="text-base font-bold text-brand-300">${salCount && leadCount ? pct(salCount, leadCount) : '—'}</div>
          <div class="text-[9px] text-slate-500">Lead→SAL</div>
        </div>
        <div class="text-center p-2 rounded-lg" style="background:#111225">
          <div class="text-base font-bold text-brand-300">${sqlCount && salCount ? pct(sqlCount, salCount) : '—'}</div>
          <div class="text-[9px] text-slate-500">SAL→SQL</div>
        </div>
        <div class="text-center p-2 rounded-lg" style="background:#111225">
          <div class="text-base font-bold text-amber-400">${oppCount && sqlCount ? pct(oppCount, sqlCount) : '—'}</div>
          <div class="text-[9px] text-slate-500">SQL→Opp</div>
        </div>
        <div class="text-center p-2 rounded-lg" style="background:#111225">
          <div class="text-base font-bold text-emerald-400">${wonCount && oppCount ? pct(wonCount, oppCount) : '—'}</div>
          <div class="text-[9px] text-slate-500">Opp→Won</div>
        </div>
      </div>`;
    }

    // ─── FUNNEL FILTER ────────────────────────────────
    const FUNNEL_ACTIVE_STAGES = ['Outbound Prospect','Outbound Lead','Inbound Lead','SAL (Book 1st Demo)','SQL (Demo Done)','RFX','Opportunity','Vendor of Choice','Order Review','Verbal Commit.','Contract Neg.','Signing','Pilot ARR'];
    const FUNNEL_CLOSED_STAGES = ['Closed Won','Lost','No Fit','Bad Timing'];

    function filterFunnel(mode) {
      document.querySelectorAll('#fAll,#fActive,#fClosed').forEach(b => b.classList.remove('pill-active'));
      document.getElementById('f' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('pill-active');
      const allowed = mode === 'all' ? STAGE_ORDER : mode === 'active' ? FUNNEL_ACTIVE_STAGES : FUNNEL_CLOSED_STAGES;
      const filtered = FUNNEL.filter(f => allowed.includes(f.stage) && f.count > 0);
      if (filtered.length === 0) {
        document.getElementById('funnelContainer').innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">No deals in this view for the selected period.</div>`;
        return;
      }
      const maxF = Math.max(...filtered.map(f => f.count));
      document.getElementById('funnelContainer').innerHTML = filtered.map(f => {
        const pctW = Math.max((f.count / maxF) * 100, 5);
        if (f.split) {
          const seg1Pct = (f.split[0].count / f.count) * 100;
          const seg2Pct = 100 - seg1Pct;
          return `<div class="flex items-center gap-3 group">
            <span class="text-[11px] text-slate-400 w-36 text-right truncate shrink-0">${f.stage}</span>
            <div class="flex-1 h-7 bg-surface-1 rounded overflow-hidden">
              <div class="bar-animate h-full rounded flex" style="width:${pctW}%">
                <div class="h-full flex items-center px-2 rounded-l" style="width:${seg1Pct}%;background:${f.split[0].color}" title="${f.split[0].label}: ${f.split[0].count}">
                  <span class="text-[10px] font-semibold text-white drop-shadow-sm whitespace-nowrap">${f.split[0].label} ${f.split[0].count}</span>
                </div>
                <div class="h-full flex items-center px-2 rounded-r" style="width:${seg2Pct}%;background:${f.split[1].color}" title="${f.split[1].label}: ${f.split[1].count}">
                  <span class="text-[10px] font-semibold text-slate-300 drop-shadow-sm whitespace-nowrap">${f.split[1].label} ${f.split[1].count}</span>
                </div>
              </div>
            </div>
          </div>`;
        }
        return `<div class="flex items-center gap-3 group">
          <span class="text-[11px] text-slate-400 w-36 text-right truncate shrink-0">${f.stage}</span>
          <div class="flex-1 h-7 bg-surface-1 rounded overflow-hidden">
            <div class="bar-animate h-full rounded flex items-center px-2" style="width:${pctW}%;background:${f.color}">
              <span class="text-[11px] font-semibold text-white drop-shadow-sm">${f.count}</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // ─── PIPELINE DATE RANGE FILTER ─────────────────────
    let activePipelineDateRange = 'all';

    function getPipelineDateBounds(range) {
      const y = 2026;
      switch(range) {
        case 'q1':       return { from: `${y}-01-01`, to: `${y}-03-31`, label: 'Q1 2026' };
        case 'jan':      return { from: `${y}-01-01`, to: `${y}-01-31`, label: 'January 2026' };
        case 'feb':      return { from: `${y}-02-01`, to: `${y}-02-28`, label: 'February 2026' };
        case 'mar':      return { from: `${y}-03-01`, to: `${y}-03-31`, label: 'March 2026' };
        case 'thisWeek': {
          const now = new Date();
          const day = now.getDay(); // 0=Sun,1=Mon,...
          const diffToMon = day === 0 ? -6 : 1 - day; // shift to Monday
          const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
          const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
          const pad = d => String(d).padStart(2,'0');
          const f = `${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`;
          const t = `${sun.getFullYear()}-${pad(sun.getMonth()+1)}-${pad(sun.getDate())}`;
          return { from: f, to: t, label: `This Week (${f.slice(5)} – ${t.slice(5)})` };
        }
        default:         return { from: null, to: null, label: 'All Time' };
      }
    }

    function setPipelineDateRange(range) {
      activePipelineDateRange = range;
      // Update button states
      document.querySelectorAll('#pipelineDateBtns button').forEach(btn => {
        btn.classList.toggle('pill-active', btn.getAttribute('data-range') === range);
      });
      const bounds = getPipelineDateBounds(range);
      // Update date inputs
      const fromEl = document.getElementById('pipelineFrom');
      const toEl = document.getElementById('pipelineTo');
      if (bounds.from) {
        fromEl.value = bounds.from;
        toEl.value = bounds.to;
      } else {
        fromEl.value = '';
        toEl.value = '';
      }
      applyPipelineDateFilter(bounds.label);
    }

    function applyPipelineCustomRange() {
      const fromVal = document.getElementById('pipelineFrom').value;
      const toVal = document.getElementById('pipelineTo').value;
      if (!fromVal || !toVal) return;
      // Clear preset button active state
      document.querySelectorAll('#pipelineDateBtns button').forEach(btn => btn.classList.remove('pill-active'));
      activePipelineDateRange = 'custom';
      const label = `${fromVal.slice(5).replace('-','/')} – ${toVal.slice(5).replace('-','/')}`;
      applyPipelineDateFilter(label);
    }

    function applyPipelineDateFilter(label) {
      // Map date range to funnel period
      const rangeToFunnelPeriod = {
        'all': 'all', 'q1': 'q1', 'mar': 'month', 'feb': 'q1', 'jan': 'q1',
        'thisWeek': 'week', 'custom': 'all'
      };
      const funnelPeriod = rangeToFunnelPeriod[activePipelineDateRange] || 'all';
      FUNNEL = FUNNEL_PERIODS[funnelPeriod] || FUNNEL_PERIODS.all;
      activeFunnelPeriod = funnelPeriod;

      // Update sublabels
      const syncDate = formatSyncTime(LAST_SYNC).split(' at')[0];
      const totalDeals = FUNNEL.reduce((s,f) => s + f.count, 0);
      const pSub = document.getElementById('pipelineSublabel');
      const cSub = document.getElementById('conversionSublabel');
      if (pSub) pSub.textContent = `${totalDeals} Deals · ${label} · As of ${syncDate}`;
      if (cSub) cSub.textContent = `How Deals flow through the pipeline · ${label}`;

      // Update Win Rate sublabel
      const wrSub = document.getElementById('winRateSublabel');
      if (wrSub) wrSub.textContent = `Win rates of all ${totalDeals} Deals · ${label}`;

      // Re-render funnel bars (respecting active/closed filter)
      filterFunnel(document.querySelector('#fAll.pill-active') ? 'all' : document.querySelector('#fActive.pill-active') ? 'active' : 'closed');

      // Re-render conversion funnel
      const cc = document.getElementById('conversionContainer');
      if (cc) cc.innerHTML = buildConversionFunnel();

      // Re-render win rate section
      const wr = document.getElementById('winRateContainer');
      if (wr) wr.innerHTML = buildWinRateSection();

      // Remove old notice if any
      const notice = document.getElementById('pipelineDateNotice');
      if (notice) notice.remove();
    }

    // Drill: Scorecard metric breakdown per person
    function drillScorecard(metric) {
      const period = PERIODS[selectedPeriod];
      let data = period.team;
      if (selectedPerson !== 'All') data = data.filter(p => p.short === selectedPerson || p.name === selectedPerson);
      if (!data.length) return;

      const labels = {
        emails: { title:'Emails Sent', color:'#818cf8', sub:'replies', subLabel:'Replies' },
        calls: { title:'Outbound Calls', color:'#a78bfa', sub:'callsConnected', subLabel:'Reached' },
        linkedin: { title:'LinkedIn Outreach', color:'#c084fc', sub:'linkedinDemos', subLabel:'Demos' },
        demos: { title:'Demos Booked', color:'#34d399', sub:null },
        pipeline: { title:'Pipeline Created', color:'#34d399', sub:'deals', subLabel:'Deals' },
      };
      const cfg = labels[metric] || { title:metric, color:'#818cf8' };
      const sorted = [...data].sort((a,b) => (b[metric]||0) - (a[metric]||0));
      const maxVal = Math.max(...sorted.map(p => p[metric]||0), 1);
      const tgt = KPI_TARGETS[selectedPeriod] || {};
      const target = tgt[metric] || 0;

      const bars = sorted.map(p => {
        const val = p[metric] || 0;
        const w = Math.max((val / maxVal) * 100, 4);
        const subVal = cfg.sub ? (p[cfg.sub]||0) : null;
        const valDisplay = metric === 'pipeline' ? fmt(val) : val;
        const clickAttr = metric === 'demos' ? `onclick="event.stopPropagation();drillDemos('${p.short}')" style="cursor:pointer"` : '';
        return `<div class="flex items-center gap-2 mb-1.5" ${clickAttr}>
          <span class="text-[11px] text-slate-400 w-16 text-right shrink-0">${p.short}</span>
          <div class="flex-1 h-7 bg-surface-1 rounded overflow-hidden">
            <div class="h-full rounded flex items-center px-2 gap-2" style="width:${w}%;background:${cfg.color}30;border-left:3px solid ${cfg.color}">
              <span class="text-[11px] font-bold text-white">${valDisplay}</span>
              ${subVal !== null ? `<span class="text-[9px] text-slate-400">(${subVal} ${cfg.subLabel})</span>` : ''}
            </div>
          </div>
          ${target > 0 ? `<span class="text-[9px] shrink-0 ${val >= target ? 'text-emerald-400' : val >= target*0.5 ? 'text-amber-400' : 'text-red-400'}">${Math.round(val/target*100)}%</span>` : ''}
        </div>`;
      }).join('');

      const total = sorted.reduce((s,p) => s + (p[metric]||0), 0);
      const totalDisplay = metric === 'pipeline' ? fmt(total) : total;

      const demoHint = metric === 'demos' ? '<div class="mt-2 text-[9px] text-slate-600 text-center">💡 Click a person for deal details</div>' : '';
      showDrill(cfg.title, `${period.label} · Per Person`, `
        ${bars}
        <div class="mt-3 pt-3 border-t border-slate-700/30 flex items-center justify-between">
          <span class="text-[11px] text-slate-400">Total</span>
          <span class="text-sm font-bold text-white">${totalDisplay}</span>
        </div>
        ${target > 0 ? `<div class="mt-1 text-[10px] text-slate-500">Target per person: ${metric === 'pipeline' ? fmt(target) : target}</div>` : ''}
        ${demoHint}
      `);
    }

    // Drill: Demo details per AE
    function drillDemos(aeName) {
      const deals = SAL_DEALS[aeName] || [];
      if (!deals.length) {
        showDrill(`Demos — ${aeName}`, 'No demos found in SAL Stage', `
          <div class="text-center py-8 text-slate-500">
            <div class="text-3xl mb-2">📭</div>
            <div class="text-sm">No SAL deals found for ${aeName}</div>
          </div>
        `);
        return;
      }

      const listHTML = deals.map((company, i) => {
        const isInbound = company.includes('(Inbound)');
        const badge = isInbound
          ? '<span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-400 font-medium">Inbound</span>'
          : '<span class="text-[9px] px-1.5 py-0.5 rounded bg-brand-500/15 text-brand-300 font-medium">Outbound</span>';
        return `<div class="flex items-center gap-3 py-2.5 px-3 rounded-lg hover:bg-white/[0.03] transition-colors ${i > 0 ? 'border-t border-slate-800/30' : ''}">
          <span class="text-[11px] text-slate-600 w-5 text-right">${i + 1}.</span>
          <span class="text-[11px] font-medium text-white flex-1">${company.replace(' (Inbound)', '')}</span>
          ${badge}
        </div>`;
      }).join('');

      showDrill(`Demos — ${aeName}`, `${deals.length} Deals in SAL Stage (Book 1st Demo)`, `
        <div class="space-y-0">${listHTML}</div>
        <div class="mt-3 pt-3 border-t border-slate-700/30 flex items-center justify-between">
          <span class="text-[11px] text-slate-400">Total SAL Deals</span>
          <span class="text-sm font-bold text-emerald-400">${deals.length}</span>
        </div>
      `);
    }

    // Drill: Funnel stage detail
    function drillFunnel(stageName) {
      const stage = FUNNEL.find(f => f.stage === stageName);
      if (!stage) return;
      const total = FUNNEL.reduce((s,f) => s + f.count, 0);
      const pctOfTotal = ((stage.count / total) * 100).toFixed(1);

      // Find previous and next stages for context
      const idx = FUNNEL.findIndex(f => f.stage === stageName);
      const prev = idx > 0 ? FUNNEL[idx-1] : null;
      const next = idx < FUNNEL.length-1 ? FUNNEL[idx+1] : null;
      const convFromPrev = prev ? ((stage.count / prev.count) * 100).toFixed(1) : null;
      const convToNext = next ? ((next.count / stage.count) * 100).toFixed(1) : null;

      let splitHTML = '';
      if (stage.split) {
        splitHTML = `<div class="mt-3">
          <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider mb-2">Breakdown</div>
          ${stage.split.map(s => {
            const w = Math.max((s.count / stage.count) * 100, 10);
            return `<div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] text-slate-400 w-16 text-right">${s.label}</span>
              <div class="flex-1 h-6 bg-surface-1 rounded overflow-hidden">
                <div class="h-full rounded flex items-center px-2" style="width:${w}%;background:${s.color}">
                  <span class="text-[10px] font-semibold text-white">${s.count} (${((s.count/stage.count)*100).toFixed(0)}%)</span>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }

      showDrill(stage.stage, `${stage.count} Deals · ${pctOfTotal}% of all Deals`, `
        <div class="grid grid-cols-3 gap-3 mb-4">
          <div class="p-3 rounded-lg text-center" style="background:#1a1b35">
            <div class="text-2xl font-bold text-white">${stage.count}</div>
            <div class="text-[10px] text-slate-500">Deals in Stage</div>
          </div>
          <div class="p-3 rounded-lg text-center" style="background:#1a1b35">
            <div class="text-2xl font-bold" style="color:${stage.color}">${pctOfTotal}%</div>
            <div class="text-[10px] text-slate-500">Share of total</div>
          </div>
          <div class="p-3 rounded-lg text-center" style="background:#1a1b35">
            <div class="text-2xl font-bold text-brand-300">#${idx+1}</div>
            <div class="text-[10px] text-slate-500">Pipeline Position</div>
          </div>
        </div>
        ${convFromPrev !== null ? `<div class="flex items-center gap-2 mb-1.5 text-[11px]">
          <span class="text-slate-500">← From ${prev.stage}:</span>
          <span class="font-semibold text-white">${prev.count} → ${stage.count}</span>
          <span class="text-brand-300 font-bold">${convFromPrev}% Conv.</span>
          <span class="text-red-400/60 text-[10px]">(−${prev.count - stage.count} Drop-off)</span>
        </div>` : ''}
        ${convToNext !== null ? `<div class="flex items-center gap-2 mb-1.5 text-[11px]">
          <span class="text-slate-500">→ To ${next.stage}:</span>
          <span class="font-semibold text-white">${stage.count} → ${next.count}</span>
          <span class="text-brand-300 font-bold">${convToNext}% Conv.</span>
          <span class="text-red-400/60 text-[10px]">(−${stage.count - next.count} Drop-off)</span>
        </div>` : ''}
        ${splitHTML}
      `);
    }

    // Drill: Person detail (from leaderboard)
    function drillPerson(personShort) {
      const period = PERIODS[selectedPeriod];
      const p = period.team.find(t => t.short === personShort);
      if (!p) return;
      const tgt = KPI_TARGETS[selectedPeriod] || {};
      const tp = p.emails + p.calls + p.linkedin;

      const metrics = [
        { label:'Emails', val:p.emails, target:tgt.emails, color:'#818cf8' },
        { label:'Replies', val:p.replies, target:null, color:'#818cf8' },
        { label:'Calls', val:p.calls, target:tgt.calls, color:'#a78bfa', extra:`${p.callsConnected}✓ ${p.callsMissed}✗` },
        { label:'LinkedIn Out', val:p.linkedin, target:null, color:'#c084fc' },
        { label:'LI\u2192Demo', val:p.linkedinDemos||0, target:null, color:'#c084fc', extra: p.linkedin > 0 ? pct(p.linkedinDemos||0, p.linkedin) + ' conv.' : '' },
        { label:'Touchpoints', val:tp, target:null, color:'#6366f1' },
        { label:'Demos', val:p.demos, target:tgt.demos, color:'#34d399' },
        { label:'Deals', val:p.deals, target:tgt.deals, color:'#f59e0b' },
        { label:'Pipeline', val:p.pipeline, target:tgt.pipeline, color:'#34d399', isCurrency:true },
        { label:'SALs', val:p.sals, target:null, color:'#7c3aed' },
        { label:'SQLs', val:p.sqls, target:null, color:'#5b21b6' },
        { label:'Opps', val:p.opps, target:null, color:'#8b5cf6' },
      ];

      const maxMetric = Math.max(...metrics.map(m => m.target || m.val || 0), 1);

      const rows = metrics.map(m => {
        const valDisplay = m.isCurrency ? fmt(m.val) : m.val;
        const pctTarget = m.target ? Math.round((m.val / m.target) * 100) : null;
        const barMax = m.target || Math.max(...period.team.map(t => {
          if (m.label === 'Pipeline') return t.pipeline;
          if (m.label === 'Touchpoints') return t.emails + t.calls + t.linkedin;
          return t[m.label.toLowerCase()] || 0;
        }), 1);
        const w = Math.max((m.val / barMax) * 100, 2);
        return `<div class="flex items-center gap-2 mb-1">
          <span class="text-[10px] text-slate-400 w-20 text-right shrink-0">${m.label}</span>
          <div class="flex-1 h-5 bg-surface-1 rounded overflow-hidden relative">
            <div class="h-full rounded flex items-center px-1.5" style="width:${w}%;background:${m.color}25;border-left:2px solid ${m.color}">
              <span class="text-[10px] font-semibold text-white">${valDisplay}</span>
              ${m.extra ? `<span class="text-[8px] text-slate-400 ml-1">(${m.extra})</span>` : ''}
            </div>
            ${m.target ? `<div class="absolute top-0 bottom-0 w-px bg-emerald-400/40" style="left:${Math.min(100, (m.target / barMax) * 100)}%" title="Target: ${m.isCurrency ? fmt(m.target) : m.target}"></div>` : ''}
          </div>
          ${pctTarget !== null ? `<span class="text-[9px] w-10 text-right shrink-0 font-bold ${pctTarget >= 100 ? 'text-emerald-400' : pctTarget >= 50 ? 'text-amber-400' : 'text-red-400'}">${pctTarget}%</span>` : '<span class="w-10"></span>'}
        </div>`;
      }).join('');

      showDrill(p.name, `${period.label} · All Metrics`, `
        ${rows}
        <div class="mt-3 pt-3 border-t border-slate-700/30 text-[10px] text-slate-500">
          Targets: ${tgt.emails||'–'}E · ${tgt.calls||'–'}C · ${tgt.demos||'–'}D · ${tgt.deals||'–'} Deals · ${fmt(tgt.pipeline||0)} Pipeline
        </div>
      `);
    }

    // ─── INIT ─────────────────────────────────────────
    // Load manual activities from Supabase, then render, then auto-sync latest data
    async function initDashboard() {
      render();
      await loadManualActs();
      render();
      // Auto-sync from Supabase to get freshest data (silent, no overlay for initial load)
      try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/dashboard_sync?select=*', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        if (resp.ok) {
          const rows = await resp.json();
          if (rows && rows.length > 0) {
            const grouped = {};
            let latestSync = null;
            for (const row of rows) {
              const { period, person_short, metric, value, synced_at } = row;
              if (!grouped[period]) grouped[period] = {};
              if (!grouped[period][person_short]) grouped[period][person_short] = {};
              grouped[period][person_short][metric] = Number(value);
              if (!latestSync || synced_at > latestSync) latestSync = synced_at;
            }
            // Apply person metrics
            const metrics = ['emails','replies','calls','callsConnected','callsMissed','coldCalls','followUpCalls',
                             'linkedin','linkedinDemos','demos','deals','pipeline','sals','sqls','opps'];
            for (const pk of ['today','week','month','q1']) {
              if (!PERIODS[pk]?.team || !grouped[pk]) continue;
              for (const person of PERIODS[pk].team) {
                const sd = grouped[pk][person.short];
                if (!sd) continue;
                for (const m of metrics) { if (sd[m] !== undefined) person[m] = sd[m]; }
              }
            }
            // Apply pipeline data
            const stageMap = {
              'Outbound Prospect':'Outbound Prospect','Outbound Lead':'Outbound Lead',
              'Inbound Lead':'Inbound Lead','SAL':'SAL (Book 1st Demo)','SQL':'SQL (Demo Done)',
              'RFX':'RFX','Opportunity':'Opportunity','Vendor of Choice':'Vendor of Choice',
              'Order Review':'Order Review','Verbal Commit':'Verbal Commit.','Contract Neg':'Contract Neg.',
              'Signing':'Signing','Pilot ARR':'Pilot ARR','Closed Won':'Closed Won',
              'Lost':'Lost','No Fit':'No Fit','Bad Timing':'Bad Timing'
            };
            for (const periodKey of Object.keys(grouped)) {
              const pData = grouped[periodKey]?.['_pipeline_'];
              if (!pData) continue;
              const counts = {};
              for (const [k, v] of Object.entries(pData)) { counts[stageMap[k]||k] = v; }
              if (FUNNEL_PERIODS[periodKey]) {
                FUNNEL_PERIODS[periodKey] = makeFunnel(counts, periodKey==='all' ? FUNNEL_PERIODS.all.find(f=>f.split)?.split : undefined);
              }
            }
            FUNNEL = FUNNEL_PERIODS[activeFunnelPeriod] || FUNNEL_PERIODS.all;
            if (latestSync) LAST_SYNC = latestSync;
            render();
            console.log('Auto-sync: loaded ' + rows.length + ' metrics from Supabase');
          }
        }
      } catch (e) { console.warn('Auto-sync skipped:', e.message); }
    }

    if (sessionStorage.getItem(AUTH_KEY) === 'true') {
      initDashboard();
    } else {
      window._pendingInit = true;
    }

    // Override unlockDashboard to also load data
    const _origUnlock = unlockDashboard;
    unlockDashboard = function() {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initDashboard();
    };
  </script>
</body>
</html>
